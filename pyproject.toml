[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarm-sim"
version = "0.1.0"
description = "Decentralized UAV Swarm Communication Resilience Simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "pandas>=2.0.0",
    "torch>=2.14.0",
    "qpsolvers>=4.13.0",
    "osqp>=1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
